<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webbo Layout</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="barra">
      <h1 id="titolo"><a href="#">Webbo Layout</a></h1>

      <button
        id="pulsante-menu"
        class="pulsante-icona"
        aria-label="Apri menu elementi"
        title="Menu elementi"
      >
        <span aria-hidden="true">☰</span>
      </button>

      <div class="pulsanti">
        <button
          id="pulsante-random"
          class="pulsante-icona"
          aria-label="Random"
          title="Disposizione random"
        >
          <span aria-hidden="true">🎲</span>
        </button>
        <button
          id="pulsante-svuota"
          class="pulsante-icona"
          aria-label="Svuota foglio"
          title="Svuota foglio"
        >
          <span aria-hidden="true">🗑</span>
        </button>
        <button
          id="pulsante-annulla"
          class="pulsante-icona"
          aria-label="Annulla ultima azione"
          title="Annulla ultima azione"
        >
          <span aria-hidden="true">↶</span>
        </button>
        <button
          id="pulsante-elimina"
          class="pulsante-icona"
          aria-label="Elimina elemento"
          title="Elimina elemento: Seleziona un elemento dal foglio e poi premi il pulsante per attivare la funzione"
        >
          <span aria-hidden="true">×</span>
        </button>

        <button
          id="pulsante-su"
          class="pulsante-icona"
          aria-label="Muovi elemento sopra"
          title="Muovi sopra: Seleziona un elemento dal foglio e premi per spostarlo di una posizione verso l'alto"
        >
          <span aria-hidden="true">↑</span>
        </button>

        <button
          id="pulsante-giu"
          class="pulsante-icona"
          aria-label="Muovi elemento sotto"
          title="Muovi sotto: Seleziona un elemento dal foglio e premi per spostarlo di una posizione verso il basso"
        >
          <span aria-hidden="true">↓</span>
        </button>

        <button
          id="pulsante-inserisci-dopo"
          class="pulsante-icona"
          aria-label="Inserisci dopo"
          title="Inserisci sotto: Seleziona un elemento dal foglio e uno dal menu, poi premi sul pulsante per attivare la funzione"
        >
          <span aria-hidden="true">+</span>
        </button>
        <button
          id="pulsante-sostituisci"
          class="pulsante-icona"
          aria-label="Sostituisci"
          title="Sostituisci: Seleziona un elemento dal foglio e uno dal menu, poi premi sul pulsante per attivare la funzione"
        >
          <span aria-hidden="true">⇄</span>
        </button>
      </div>
      <p class="page">
        <a
          href="https://github.com/OlracK-SpeZ"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub page</a
        >
      </p>
      <button
        id="pulsante-download"
        type="button"
        aria-label="Scarica il foglio come immagine"
        title="Scarica il foglio come immagine"
      >
        <span aria-hidden="true" id="download-label">Download Layout</span>
      </button>
    </header>
